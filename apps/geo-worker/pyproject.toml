[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-watch-geo-worker"
version = "0.1.0"
description = "Sentinel-2 coffee plantation candidate detection worker"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "rasterio>=1.4,<2", "scipy>=1.15,<2", "shapely>=2,<3",
  "pyproj>=3.6,<4", "Pillow>=11,<14", "scikit-learn==1.9.1",
  "joblib>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
research = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
