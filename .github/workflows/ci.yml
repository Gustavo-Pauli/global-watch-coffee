name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/geo-worker/pyproject.toml
      - name: Install geo-worker
        run: python -m pip install -e './apps/geo-worker[dev]'
      - name: Python regressions and real-pixel integration
        run: python -m pytest apps/geo-worker/tests -q --disable-warnings
      - name: Required repository files
        run: python scripts/check_repository.py
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: global_watch_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d global_watch_audit_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/global_watch_audit_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/global_watch_audit_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-replace-before-deploy-012345678901234567
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder
      PYTHON_WORKER_URL: http://127.0.0.1:8000
      WORKER_SECRET: ci-worker-secret-01234567890123456789012345
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_do_not_use
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies and generate Prisma Client
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Apply migrations to disposable database
        run: pnpm db:deploy
      - name: Web regressions and PostgreSQL integration
        run: pnpm test:web
      - name: Typecheck
        run: pnpm --filter @global-watch/web typecheck
      - name: Build Next.js without real external credentials
        run: pnpm --filter @global-watch/web build
