services:
  - type: web
    name: global-watch-geo-worker
    runtime: python
    plan: free
    # Root dir MUST be repository root: demo scenes live under data/.
    buildCommand: pip install -e apps/geo-worker
    # Exactly one process: the bounded job semaphore lives in process memory.
    startCommand: uvicorn geo_worker.server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: WORKER_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: NEXT_CALLBACK_URL
        sync: false
